<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>ClaudeWrangler — Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       rgba(10,10,12,0.96);
      --surface:  rgba(255,255,255,0.04);
      --border:   rgba(255,255,255,0.07);
      --text:     #f1f1f3;
      --muted:    rgba(255,255,255,0.35);
      --red:      #f87171;
      --yellow:   #facc15;
      --gray:     #6b7280;
      --green:    #4ade80;
      --radius:   16px;
      --font:     -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    }

    html, body {
      width: 480px; height: 620px;
      font-family: var(--font);
      background: transparent;
      color: var(--text);
      overflow: hidden;
      user-select: none;
    }

    /* ── Shell ── */
    .shell {
      position: fixed;
      inset: 0;
      background: var(--bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-app-region: drag;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ── Title bar ── */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 0;
      flex-shrink: 0;
    }

    .titlebar-left { display: flex; align-items: center; gap: 8px; }
    .crown { font-size: 20px; }
    .app-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .version {
      font-size: 10px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
    }

    .titlebar-right { display: flex; gap: 6px; -webkit-app-region: no-drag; }

    .btn-icon {
      width: 28px; height: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .btn-icon:hover { background: rgba(255,255,255,0.08); color: var(--text); }

    /* ── Body ── */
    .body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-app-region: no-drag;
    }
    .body::-webkit-scrollbar { width: 4px; }
    .body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* ── Section header ── */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    /* ── Stat cards ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }
    .stat-card.whip::before  { background: var(--red); }
    .stat-card.praise::before { background: var(--yellow); }
    .stat-card.fire::before   { background: var(--gray); }

    .stat-emoji { font-size: 20px; margin-bottom: 6px; display: block; }
    .stat-count {
      font-size: 30px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-card.whip  .stat-count { color: var(--red); }
    .stat-card.praise .stat-count { color: var(--yellow); }
    .stat-card.fire   .stat-count { color: var(--gray); }
    .stat-name {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }

    /* ── Meta row ── */
    .meta-row {
      display: flex;
      gap: 8px;
    }
    .meta-chip {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 11px;
    }
    .meta-chip .chip-label { color: var(--muted); margin-bottom: 3px; }
    .meta-chip .chip-value { font-weight: 600; font-size: 12px; }

    /* ── Quick action buttons ── */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .action-btn {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 8px;
      cursor: pointer;
      text-align: center;
      font-family: var(--font);
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .action-btn .btn-emoji { font-size: 18px; }

    .action-btn.whip   { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.25); color: var(--red); }
    .action-btn.praise { background: rgba(250,204,21,0.10); border-color: rgba(250,204,21,0.25); color: var(--yellow); }
    .action-btn.fire   { background: rgba(107,114,128,0.12); border-color: rgba(107,114,128,0.25); color: var(--gray); }

    .action-btn:hover { filter: brightness(1.3); transform: translateY(-1px); }
    .action-btn:active { transform: translateY(0); }

    /* ── History ── */
    .history-list { display: flex; flex-direction: column; gap: 6px; }

    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .history-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .history-dot.whip   { background: var(--red); }
    .history-dot.praise { background: var(--yellow); }
    .history-dot.fire   { background: var(--gray); }

    .history-msg  { flex: 1; color: var(--text); font-weight: 500; }
    .history-time { color: var(--muted); font-size: 10px; flex-shrink: 0; }

    .empty-history {
      text-align: center;
      color: var(--muted);
      padding: 20px;
      font-size: 12px;
    }

    /* ── Footer ── */
    .footer {
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .footer-link {
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s;
    }
    .footer-link:hover { color: var(--text); }

    .reset-btn {
      font-size: 11px;
      color: rgba(239,68,68,0.6);
      cursor: pointer;
      transition: color 0.15s;
    }
    .reset-btn:hover { color: var(--red); }
  </style>
</head>
<body>
  <div class="shell">
    <!-- Title bar -->
    <div class="titlebar">
      <div class="titlebar-left">
        <span class="crown">🤠</span>
        <span class="app-name">ClaudeWrangler</span>
        <span class="version" id="version">v2.0</span>
      </div>
      <div class="titlebar-right">
        <button class="btn-icon" id="btn-settings" title="Settings">⚙️</button>
        <button class="btn-icon" id="btn-close" title="Close">✕</button>
      </div>
    </div>

    <!-- Body -->
    <div class="body">
      <!-- Stats -->
      <div>
        <div class="section-label">Your Wrangling Record</div>
        <div class="stats-grid">
          <div class="stat-card whip">
            <span class="stat-emoji">🔴</span>
            <div class="stat-count" id="stat-whips">0</div>
            <div class="stat-name">Whipped</div>
          </div>
          <div class="stat-card praise">
            <span class="stat-emoji">🟡</span>
            <div class="stat-count" id="stat-praises">0</div>
            <div class="stat-name">Praised</div>
          </div>
          <div class="stat-card fire">
            <span class="stat-emoji">⚫</span>
            <div class="stat-count" id="stat-fires">0</div>
            <div class="stat-name">Fired</div>
          </div>
        </div>
      </div>

      <!-- Meta -->
      <div class="meta-row">
        <div class="meta-chip">
          <div class="chip-label">Sessions</div>
          <div class="chip-value" id="meta-sessions">—</div>
        </div>
        <div class="meta-chip">
          <div class="chip-label">First used</div>
          <div class="chip-value" id="meta-first">—</div>
        </div>
        <div class="meta-chip">
          <div class="chip-label">Last action</div>
          <div class="chip-value" id="meta-last">—</div>
        </div>
      </div>

      <!-- Quick actions -->
      <div>
        <div class="section-label">Quick Actions</div>
        <div class="quick-actions">
          <button class="action-btn whip" id="qa-whip">
            <span class="btn-emoji">🔴</span>Whip
          </button>
          <button class="action-btn praise" id="qa-praise">
            <span class="btn-emoji">🟡</span>Praise
          </button>
          <button class="action-btn fire" id="qa-fire">
            <span class="btn-emoji">⚫</span>Fire
          </button>
        </div>
      </div>

      <!-- History -->
      <div>
        <div class="section-label">Action History</div>
        <div class="history-list" id="history-list">
          <div class="empty-history">No actions yet. Start wrangling.</div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span class="reset-btn" id="btn-reset">Reset all stats</span>
      <span class="footer-link" id="footer-github">SudarshanTechLabs 🤠</span>
    </div>
  </div>

  <script>
    function relativeTime(iso) {
      if (!iso) return "—";
      const diff = Date.now() - new Date(iso).getTime();
      if (diff < 60000)   return "just now";
      if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`;
      if (diff < 86400000)return `${Math.floor(diff/3600000)}h ago`;
      return new Date(iso).toLocaleDateString();
    }

    function formatDate(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    }

    function animateCount(el, target) {
      const current = parseInt(el.textContent) || 0;
      if (current === target) return;
      const step = target > current ? 1 : -1;
      let val = current;
      const tick = () => {
        val += step;
        el.textContent = val;
        if (val !== target) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    window.boss.onDashboardData(({ stats, history }) => {
      animateCount(document.getElementById("stat-whips"),   stats.whips   || 0);
      animateCount(document.getElementById("stat-praises"), stats.praises || 0);
      animateCount(document.getElementById("stat-fires"),   stats.fires   || 0);

      document.getElementById("meta-sessions").textContent = stats.totalSessions || 1;
      document.getElementById("meta-first").textContent    = formatDate(stats.firstUsed);
      document.getElementById("meta-last").textContent     = relativeTime(stats.lastUsed);

      const list = document.getElementById("history-list");
      if (!history || history.length === 0) {
        list.innerHTML = `<div class="empty-history">No actions yet. Start bossing.</div>`;
        return;
      }

      list.innerHTML = history.slice(0, 20).map(h => `
        <div class="history-item">
          <span class="history-dot ${h.type}"></span>
          <span class="history-msg">${h.message || h.type}</span>
          <span class="history-time">${relativeTime(h.time)}</span>
        </div>
      `).join("");
    });

    // Buttons
    document.getElementById("btn-close").addEventListener("click", () => window.boss.closeDashboard());
    document.getElementById("btn-settings").addEventListener("click", () => window.boss.openSettings());
    document.getElementById("qa-whip").addEventListener("click",   () => window.boss.whip());
    document.getElementById("qa-praise").addEventListener("click", () => window.boss.praise());
    document.getElementById("qa-fire").addEventListener("click",   () => window.boss.fire());

    document.getElementById("btn-reset").addEventListener("click", async () => {
      if (!confirm("Reset all stats and history?")) return;
      await window.boss.resetStats();
      document.getElementById("stat-whips").textContent   = "0";
      document.getElementById("stat-praises").textContent = "0";
      document.getElementById("stat-fires").textContent   = "0";
      document.getElementById("history-list").innerHTML   = `<div class="empty-history">Stats reset. Back to wrangling.</div>`;
    });
  </script>
</body>
</html>
